<rect x="40" y="40" width="357" height="136" rx="16" fill="#101216" stroke="#1E2128"/>
<text x="64.0" y="76.0" font-family="'DM Sans', sans-serif" font-weight="700" font-size="11" fill="#FF9C00" text-anchor="start" letter-spacing="2.20" opacity="1">RESPONSIVIDADE</text>
<text x="64.0" y="114.0" font-family="'Bricolage Grotesque', sans-serif" font-weight="700" font-size="24" fill="#F2F3F6" text-anchor="start" opacity="1">Qualquer tela</text>
<text x="64.0" y="146.0" font-family="'DM Sans', sans-serif" font-weight="400" font-size="14.5" fill="#8B909C" text-anchor="start" opacity="1">Layouts que se adaptam do celular ao desktop.</text>
<rect x="421" y="40" width="357" height="136" rx="16" fill="#101216" stroke="#1E2128"/>
<text x="445.0" y="76.0" font-family="'DM Sans', sans-serif" font-weight="700" font-size="11" fill="#FF9C00" text-anchor="start" letter-spacing="2.20" opacity="1">DESIGN</text>
<text x="445.0" y="114.0" font-family="'Bricolage Grotesque', sans-serif" font-weight="700" font-size="24" fill="#F2F3F6" text-anchor="start" opacity="1">Interfaces e identidade</text>
<text x="445.0" y="146.0" font-family="'DM Sans', sans-serif" font-weight="400" font-size="14.5" fill="#8B909C" text-anchor="start" opacity="1">Design systems, identidade visual e motion.</text>
<rect x="802" y="40" width="357" height="136" rx="16" fill="#101216" stroke="#1E2128"/>
<text x="826.0" y="76.0" font-family="'DM Sans', sans-serif" font-weight="700" font-size="11" fill="#FF9C00" text-anchor="start" letter-spacing="2.20" opacity="1">COMPROMETIMENTO</text>
<text x="826.0" y="114.0" font-family="'Bricolage Grotesque', sans-serif" font-weight="700" font-size="24" fill="#F2F3F6" text-anchor="start" opacity="1">Pode contar comigo</text>
<text x="826.0" y="146.0" font-family="'DM Sans', sans-serif" font-weight="400" font-size="14.5" fill="#8B909C" text-anchor="start" opacity="1">Pontual e responsável com prazos e o time.</text>
<rect x="40" y="204" width="357" height="136" rx="16" fill="#101216" stroke="#1E2128"/>
<text x="64.0" y="240.0" font-family="'DM Sans', sans-serif" font-weight="700" font-size="11" fill="#FF9C00" text-anchor="start" letter-spacing="2.20" opacity="1">COMUNICAÇÃO</text>
<text x="64.0" y="278.0" font-family="'Bricolage Grotesque', sans-serif" font-weight="700" font-size="24" fill="#F2F3F6" text-anchor="start" opacity="1">Ouvir antes de construir</text>
<text x="64.0" y="310.0" font-family="'DM Sans', sans-serif" font-weight="400" font-size="14.5" fill="#8B909C" text-anchor="start" opacity="1">5 anos de atendimento ao público.</text>
<rect x="421" y="204" width="357" height="136" rx="16" fill="#101216" stroke="#1E2128"/>
<text x="445.0" y="240.0" font-family="'DM Sans', sans-serif" font-weight="700" font-size="11" fill="#FF9C00" text-anchor="start" letter-spacing="2.20" opacity="1">INTERFACES INTUITIVAS</text>
<text x="445.0" y="278.0" font-family="'Bricolage Grotesque', sans-serif" font-weight="700" font-size="24" fill="#F2F3F6" text-anchor="start" opacity="1">Simples de usar</text>
<text x="445.0" y="310.0" font-family="'DM Sans', sans-serif" font-weight="400" font-size="14.5" fill="#8B909C" text-anchor="start" opacity="1">Telas claras e o importante sempre à mão.</text>
<rect x="802" y="204" width="357" height="136" rx="16" fill="#101216" stroke="#1E2128"/>
<text x="826.0" y="240.0" font-family="'DM Sans', sans-serif" font-weight="700" font-size="11" fill="#FF9C00" text-anchor="start" letter-spacing="2.20" opacity="1">APRENDIZADO CONTÍNUO</text>
<text x="826.0" y="278.0" font-family="'Bricolage Grotesque', sans-serif" font-weight="700" font-size="24" fill="#F2F3F6" text-anchor="start" opacity="1">Sempre estudando</text>
